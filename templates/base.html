<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'dashboard' %}">CampusConnect</a>
      <div class="d-flex align-items-center gap-3">
        {% if user.is_authenticated %}
          <span class="text-body-secondary small">Hi, {{ user.username }}!</span>
          <a class="link-secondary small" href="{% url 'profile' %}">Profile</a>
          <form method="post" action="{% url 'logout' %}" class="m-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-secondary btn-sm">Log out</button>
          </form>
        {% else %}
          <a class="link-secondary small" href="{% url 'login' %}">Log in</a>
          <a class="btn btn-primary btn-sm" href="{% url 'signup' %}">Sign up</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="container py-5">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
